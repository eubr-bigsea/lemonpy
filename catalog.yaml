catalogs:
  default:
    source_name: pg_test
    databases:
      postgres:
        schemas:
          public:
            tables:
              iris:
                columns:
                  sepallength:
                    type: float
                  class:
                    type: varchar
                    size: 50
              titanic:
                columns:
                  id:
                    type: int
                  pclass:
                    type: str
            views:
              test: {}
          company:
            tables:
              locations:
                view: 'SELECT * FROM postgres.company.fake_locations'
              employees:
                columns:
                  salary:
                    type: float
                    roles:
                      reader:
                        action: DENY
                      manager:
                        action: WHERE
                        value: (salary < 100)
                      reporter:
                        action: BUCKETS
                        value: 10
                      group1:
                        action: PROJECT
                        value: (case salary > 10000 then 'rich' else 'poor' end)
                      group2:
                        action: ANONYMIZE
                        value: []
              departments: {}
              managers:
                view: 'SELECT * FROM employees WHERE manager = 1'
                cache:
                  type: REFLECTION
                  ttl_in_seconds: 3600
                  validity_test: 'SELECT'
            views: {}
      example:
        schemas:
          tables:
            lixo: {}

